name: Build Tutor Grow Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK licenses & Pillow
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager 2>/dev/null | head -n 1)
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          if [ -n "$SDKMANAGER" ]; then
            echo "Accepting Android SDK licenses via $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Install npm dependencies & bundle vendor scripts
        run: |
          npm install
          npm run prepare-vendor

      - name: Add and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          python3 scripts/generate-android-icons.py
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Tutor-Grow-v2.apk
          ls -lh Tutor-Grow-v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tutor-Grow-v2-APK
          path: Tutor-Grow-v2.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Tutor Grow v2.0.${{ github.run_number }}
          body: |
            **Tutor Grow — Language Teaching Journal (v2.0.${{ github.run_number }})**
            - Online Multi-User per Tutor (Supabase Auth + Row Level Security)
            - Growly Brand Kit v2.0 (Warm White Light Mode + Dark Mode, Nunito & Montserrat)
            - 5-Language UI Switcher (ID, EN, JA, KO, ZH)
            - Private & Group Classes (Flat or Per-Student Fee), Session Packages, Repeat Weekly Calendar
            - Another Session Last-Lesson & Homework Context + Full Statistics
            - Editable WhatsApp Templates + Monthly / Per-Package PDF Progress Reports
            - Local Android Teaching Reminders + Custom Growly Launcher Icon
          files: Tutor-Grow-v2.apk
