name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install
          npx cap add android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Rekap-Tutor-Bahasa.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rekap-Tutor-Bahasa-APK
          path: ./Rekap-Tutor-Bahasa.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Rekap Tutor Bahasa APK v1.0.${{ github.run_number }}"
          files: ./Rekap-Tutor-Bahasa.apk
          generate_release_notes: false
        continue-on-error: true
